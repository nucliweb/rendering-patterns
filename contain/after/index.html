<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Containment — After · Rendering Patterns</title>
  <link rel="stylesheet" href="/assets/metrics-overlay.css">
  <link rel="stylesheet" href="/assets/demo-nav.css">
  <link rel="stylesheet" href="/contain/kanban.css">
  <script src="/assets/theme.js"></script>
  <style>
    .kanban-column { contain: layout; }
  </style>
</head>
<body>

  <nav class="demo-nav">
    <a href="/">Home</a>
    <span class="sep">/</span>
    <span>CSS Containment</span>

    <span class="current-label after">after</span>
    <span class="devtools-hint">⚙ DevTools → Performance · CPU ×4</span>

  <div class="board-banner">
    <span>Containment:</span>
    <span class="badge badge-after">contain: layout — reflow scope: column only</span>
    <span style="margin-left:0.5rem">·</span>
    <span>Last reflow:</span>
    <span id="reflow-time" class="reflow-time">—</span>
    <span style="margin-left:0.5rem">·</span>
    <span>Long tasks:</span>
    <span id="long-tasks">0</span>
    <span class="hint">100 cards · edit any title</span>
  </div>

  <div id="kanban-board" class="kanban-board"></div>

  <script src="/assets/metrics-overlay.js"></script>
  <script src="/contain/kanban.js"></script>
