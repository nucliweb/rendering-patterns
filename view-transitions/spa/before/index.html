<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Transitions SPA — Before · Rendering Patterns</title>
  <link rel="stylesheet" href="/assets/metrics-overlay.css">
  <link rel="stylesheet" href="/assets/demo-nav.css">
  <link rel="stylesheet" href="/view-transitions/shop.css">
  <script src="/assets/theme.js"></script>
</head>
<body>

  <nav class="demo-nav">
    <a href="/">Home</a>
    <span class="sep">/</span>
    <span>View Transitions SPA</span>
    <span class="sep">/</span>
    <span class="current-label before">before</span>
    <span class="devtools-hint">Watch the jarring instant swap on click</span>
    <a href="/view-transitions/spa/after/" class="switch-link to-after">View after →</a>
    <button id="theme-toggle" title="Toggle theme">☀</button>
  </nav>

  <div class="demo-hint-before">
    <strong>What's missing:</strong>
    Clicking a product causes an abrupt instant swap — no visual continuity.
    The eye loses context on every navigation.
    <code>document.startViewTransition()</code> is nowhere in sight.
  </div>

  <div id="app"></div>

  <script src="/assets/metrics-overlay.js"></script>
  <script src="/view-transitions/products.js"></script>
  <script>
    const app = document.getElementById('app');
    let currentProduct = null;

    function badgeHtml(badge) {
      if (!badge) return '';
      return `<div class="product-badge badge-${badge.toLowerCase().replace(' ', '-')}">${badge}</div>`;
    }

    function renderList(returningFrom = null) {
      document.title = 'Tech Shop — View Transitions SPA Before';
      app.innerHTML = `
        <div class="shop-header">
          <h1>Tech Shop</h1>
          <p>Click any product to navigate to the detail page</p>
        </div>
        <div class="product-grid">
          ${PRODUCTS.map(p => `
            <div class="product-card" data-id="${p.id}">
              <div class="product-thumb"
                   style="background: linear-gradient(135deg, ${p.dark}, ${p.color})">
                <span class="product-thumb-emoji">${p.emoji}</span>
              </div>
              <div class="product-card-body">
                ${badgeHtml(p.badge)}
                <div class="product-name">${p.name}</div>
                <div class="product-price">$${p.price.toFixed(2)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;

      document.querySelectorAll('.product-card').forEach(card => {
        card.addEventListener('click', () => navigateTo(Number(card.dataset.id)));
      });
    }

    function renderDetail(product) {
      currentProduct = product;
      document.title = `${product.name} — View Transitions SPA Before`;
      app.innerHTML = `
        <div class="shop-detail">
          <button class="detail-back" id="back-btn">← Back to shop</button>
          <div class="detail-layout">
            <div class="product-thumb"
                 style="background: linear-gradient(135deg, ${product.dark}, ${product.color})">
              <span class="product-thumb-emoji">${product.emoji}</span>
            </div>
            <div class="detail-info">
              ${badgeHtml(product.badge)}
              <h1 class="detail-name">${product.name}</h1>
              <p class="detail-price">$${product.price.toFixed(2)}</p>
              <p class="detail-desc">${product.desc}</p>
              <button class="detail-btn">Add to cart</button>
            </div>
          </div>
        </div>
      `;
      document.getElementById('back-btn').addEventListener('click', navigateBack);
    }

    function navigateTo(productId) {
      const product = PRODUCTS.find(p => p.id === productId);
      renderDetail(product);
    }

    function navigateBack() {
      const returningFrom = currentProduct?.id ?? null;
      currentProduct = null;
      renderList(returningFrom);
    }

    renderList();
  </script>
</body>
</html>
